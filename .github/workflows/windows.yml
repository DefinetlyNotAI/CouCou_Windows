name: Windows

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - run: cargo test
      - run: node --test scripts/island.test.mjs
      - run: npm run pack
      - uses: actions/upload-artifact@v4
        with:
          name: CouCou-Shahm-Edition-Windows
          path: release/*-setup.exe
          if-no-files-found: error
